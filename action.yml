name: 'Terraform module API diff'
description: 'Classify a Terraform module API change as major, minor or patch and block a tag that undersells it.'
author: 'Michael Tarassov'
branding:
  icon: 'git-commit'
  color: 'purple'

inputs:
  dir:
    description: 'Module path inside the repository.'
    required: false
    default: '.'
  from:
    description: 'Old git ref: the tag or commit you are comparing against, or latest-tag for the highest release tag (under tag-prefix) reachable from `to`.'
    required: false
    default: 'latest-tag'
  tag-prefix:
    description: 'Release tag prefix for monorepos that tag each module, such as vpc/. Used by latest-tag and suggest-version.'
    required: false
    default: ''
  contract:
    description: 'Contract file (from --write-contract) to check the module at `to` against. When set, `from`, `tag-prefix` and `suggest-version` are not used.'
    required: false
    default: ''
  to:
    description: 'New git ref.'
    required: false
    default: 'HEAD'
  expect:
    description: 'The bump you intend to publish (major, minor or patch). When set, it replaces fail-on.'
    required: false
    default: ''
  fail-on:
    description: 'Fail at this severity or above: major, minor, patch or never.'
    required: false
    default: 'major'
  suggest-version:
    description: 'Compute the next release tag from `from` and the severity, exposed as the next-version output. `from` must then be a release tag.'
    required: false
    default: 'false'
  summary:
    description: 'Append the markdown report to the job summary.'
    required: false
    default: 'true'
  junit:
    description: 'Write a JUnit XML report to this path, for a test-report step to publish. Empty to skip.'
    required: false
    default: ''
  go-version:
    description: 'Go toolchain used to build the CLI (any actions/setup-go version spec; must be 1.26 or newer).'
    required: false
    default: 'stable'

outputs:
  severity:
    description: 'The computed severity: major, minor or patch.'
    value: ${{ steps.diff.outputs.severity }}
  previous-tag:
    description: 'The ref compared against: `from` as given, the tag latest-tag resolved to, or the contract path.'
    value: ${{ steps.diff.outputs.previous-tag }}
  next-version:
    description: 'The next release tag (for example vpc/v1.3.0), set only when suggest-version is true.'
    value: ${{ steps.diff.outputs.next-version }}
  exit-code:
    description: '0 when the change passed the gate, 1 when it was rejected.'
    value: ${{ steps.diff.outputs.exit-code }}

runs:
  using: composite
  steps:
    - uses: actions/setup-go@v7
      with:
        go-version: ${{ inputs.go-version }}
        cache: false

    - name: Build tf-module-api-diff
      shell: bash
      working-directory: ${{ github.action_path }}
      run: go build -o "$RUNNER_TEMP/tf-module-api-diff" ./cmd/tf-module-api-diff

    - name: Diff the module API
      id: diff
      shell: bash
      env:
        INPUT_DIR: ${{ inputs.dir }}
        INPUT_FROM: ${{ inputs.from }}
        INPUT_TO: ${{ inputs.to }}
        INPUT_TAG_PREFIX: ${{ inputs.tag-prefix }}
        INPUT_SUGGEST_VERSION: ${{ inputs.suggest-version }}
        INPUT_EXPECT: ${{ inputs.expect }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_SUMMARY: ${{ inputs.summary }}
        INPUT_CONTRACT: ${{ inputs.contract }}
        INPUT_JUNIT: ${{ inputs.junit }}
      run: |
        bin="$RUNNER_TEMP/tf-module-api-diff"
        args=(--dir "$INPUT_DIR" --to "$INPUT_TO" --fail-on "$INPUT_FAIL_ON")
        if [ -n "$INPUT_CONTRACT" ]; then
          # The contract is the old side, so from and the tag inputs drop out.
          args+=(--contract "$INPUT_CONTRACT")
        else
          args+=(--from "$INPUT_FROM")
          if [ -n "$INPUT_TAG_PREFIX" ]; then
            args+=(--tag-prefix "$INPUT_TAG_PREFIX")
          fi
          if [ "$INPUT_SUGGEST_VERSION" = "true" ]; then
            args+=(--suggest-version)
          fi
        fi
        if [ -n "$INPUT_EXPECT" ]; then
          args+=(--expect "$INPUT_EXPECT")
        fi

        # Exit 1 means "the gate rejected this change", which is a result and
        # not a crash. Composite steps run under `bash -e`, so the code has to
        # be captured here or the step aborts before recording anything.
        set +e
        "$bin" "${args[@]}" --format json > "$RUNNER_TEMP/api-diff.json"
        code=$?
        set -e

        if [ "$code" -gt 1 ]; then
          cat "$RUNNER_TEMP/api-diff.json" || true
          echo "::error::tf-module-api-diff could not read the module (exit $code)"
          exit "$code"
        fi

        severity=$(grep -m1 '"severity"' "$RUNNER_TEMP/api-diff.json" | sed -E 's/.*"severity": *"([a-z]+)".*/\1/')
        previous=$(grep -m1 '"from"' "$RUNNER_TEMP/api-diff.json" | sed -E 's/.*"from": *"(.*)",?$/\1/')
        next=$(grep -m1 '"next_version"' "$RUNNER_TEMP/api-diff.json" | sed -E 's/.*"next_version": *"(.*)",?$/\1/' || true)
        echo "severity=$severity" >> "$GITHUB_OUTPUT"
        echo "previous-tag=$previous" >> "$GITHUB_OUTPUT"
        echo "next-version=$next" >> "$GITHUB_OUTPUT"
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"

        if [ -n "$INPUT_JUNIT" ]; then
          set +e
          "$bin" "${args[@]}" --format junit > "$INPUT_JUNIT"
          set -e
        fi

        if [ "$INPUT_SUMMARY" = "true" ]; then
          set +e
          "$bin" "${args[@]}" --format markdown >> "$GITHUB_STEP_SUMMARY"
          set -e
        fi

        if [ "$code" -ne 0 ]; then
          echo "::error::module API change is $severity, which the configured gate rejects"
        fi
        exit "$code"
